<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hunter Portal</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://openfpcdn.io/fingerprintjs/v4/iife.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0e14;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }
  .card {
    background: #10141c;
    border: 1px solid #1c2230;
    border-radius: 24px;
    padding: 48px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .icon-wrap {
    width: 96px;
    height: 96px;
    margin: 0 auto 28px;
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 44px;
    transition: background 0.4s ease;
  }
  .icon-wrap.locked { background: rgba(59, 130, 246, 0.12); }
  .icon-wrap.done { background: rgba(16, 185, 129, 0.12); border: 1px solid rgba(16,185,129,0.3); }

  h1 {
    color: #f2f4f8;
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 10px;
  }
  p.sub {
    color: #8892a4;
    font-size: 15px;
    margin-bottom: 32px;
  }
  .spinner {
    width: 56px;
    height: 56px;
    margin: 0 auto 28px;
    border-radius: 50%;
    border: 4px solid #1c2230;
    border-top-color: #3b82f6;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .check-circle {
    width: 56px;
    height: 56px;
    margin: 0 auto 28px;
    border-radius: 50%;
    border: 2px solid #10b981;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #10b981;
    font-size: 28px;
  }

  .bar-track {
    height: 6px;
    background: #1c2230;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .bar-fill {
    height: 100%;
    background: #3b82f6;
    width: 0%;
    border-radius: 3px;
    transition: width 3s linear;
  }
  .bar-fill.done { background: #10b981; width: 100% !important; transition: width 0.4s ease; }

  .status-text { color: #f2f4f8; font-weight: 700; font-size: 16px; margin-bottom: 6px; }
  .status-hint { color: #6b7486; font-size: 13px; margin-bottom: 8px; }

  .open-btn {
    display: none;
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    background: #10b981;
    color: #06251d;
    font-weight: 800;
    font-size: 16px;
    border: none;
    border-radius: 14px;
  }
  .footer {
    margin-top: 28px;
    color: #4b5468;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap locked" id="iconWrap">🔒</div>
    <h1 id="title">Verification</h1>
    <p class="sub" id="subtitle">Please wait while we verify your account</p>

    <div class="spinner" id="spinner"></div>
    <div class="check-circle" id="checkCircle" style="display:none;">✓</div>

    <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>

    <div class="status-text" id="statusText">Verifying...</div>
    <div class="status-hint" id="statusHint">Please keep this page open</div>

    <button class="open-btn" id="openBtn">Open Bot →</button>

    <div class="footer">Hunter Portal • Secure Verification</div>
  </div>

<script>
  const tg = window.Telegram.WebApp;
  tg.ready();
  tg.expand();

  const barFill = document.getElementById('barFill');
  setTimeout(() => { barFill.style.width = '100%'; }, 100);

  FingerprintJS.load().then(fp => fp.get()).then(result => {
    const payload = {
      visitorId: result.visitorId,
      confidence: result.confidence.score,
      platform: navigator.platform,
      ua: navigator.userAgent,
      tz: Intl.DateTimeFormat().resolvedOptions().timeZone
    };

    setTimeout(() => {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('checkCircle').style.display = 'flex';
      document.getElementById('iconWrap').classList.remove('locked');
      document.getElementById('iconWrap').classList.add('done');
      document.getElementById('iconWrap').textContent = '✅';
      document.getElementById('title').textContent = 'Verified!';
      document.getElementById('subtitle').textContent = 'Your account has been verified';
      document.getElementById('barFill').classList.add('done');
      document.getElementById('statusText').textContent = 'Full Access Granted';
      document.getElementById('statusHint').textContent = 'Opening your main menu in Telegram...';

      const btn = document.getElementById('openBtn');
      btn.style.display = 'block';
      btn.onclick = () => {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      };

      setTimeout(() => {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      }, 1800);

    }, 3200);
  });
</script>
</body>
</html>
